name: Release

# Veröffentlicht eine Version der Firmware für den CAN-Leser unter
# „Releases“. Auslöser: ein Tag `v*` (z. B. v0.3.0; mit Bindestrich wie
# v0.3.0-beta1 als Vorabversion) oder von Hand, dann mit einem Tag als Ref.
#
# Zwei Dateien:
# - can-logger-xiao-esp32c6.bin: nur die App (Adresse 0x10000), für ein
#   Update mit esptool oder PlatformIO.
# - can-logger-xiao-esp32c6-factory.bin: Bootloader, Partitionen und App in
#   einer Datei ab Adresse 0. Die nimmt der Web-Flasher (flasher.yml).
#
# Läuft im Environment „release“ (nur Tags `v*`, Freigabe durch den
# Besitzer, siehe CLAUDE.md, Abschnitt „Release“). Fremde Actions sind auf
# Commit-SHAs festgelegt (Kommentar = Version).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Firmware veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - name: Nur von einem Tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Releases nur von einem Tag v* (beim Start von Hand einen Tag als Ref wählen)."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Firmware – Kern-Tests
        working-directory: firmware
        run: ./test/run_tests.sh

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # pioarduino legt neben firmware.bin von selbst firmware.factory.bin an
      # (esptool merge-bin). Fehlt sie, bricht der Lauf ab: Ohne sie hätte
      # der Web-Flasher nichts zu flashen.
      - name: Firmware bauen
        working-directory: firmware
        run: |
          pip install --quiet platformio
          pio run -e xiao_esp32c6
          build=.pio/build/xiao_esp32c6
          if [ ! -s "$build/firmware.factory.bin" ]; then
            echo "::error::$build/firmware.factory.bin fehlt (zusammengeführtes Image für den Web-Flasher)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/out"
          cp "$build/firmware.bin" "$RUNNER_TEMP/out/can-logger-xiao-esp32c6.bin"
          cp "$build/firmware.factory.bin" "$RUNNER_TEMP/out/can-logger-xiao-esp32c6-factory.bin"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Firmware für den CAN-Leser (Seeed XIAO ESP32-C6 mit XIAO CAN Bus
            Expansion Board), zur App Auto Tracker.

            - Am einfachsten im Browser flashen: siehe README, „Firmware flashen“.
            - `can-logger-xiao-esp32c6-factory.bin`: komplett ab Adresse 0x0.
            - `can-logger-xiao-esp32c6.bin`: nur die App ab Adresse 0x10000.

            Nur mithören; Nutzung auf eigene Gefahr.
          files: ${{ runner.temp }}/out/*
