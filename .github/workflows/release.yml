name: Release

# Veröffentlicht eine Version: signierte Werkbank-APK und Firmware unter
# „Releases“. Auslöser: ein Tag `v*` (z. B. v0.1.0; mit Bindestrich wie
# v0.2.0-beta1 als Vorabversion) oder von Hand, dann mit einem Tag als Ref.
#
# Der Signaturschlüssel liegt als Secrets im Environment „release“
# (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, optional KEY_PASSWORD),
# nicht in den Repo-Secrets. Das Environment lässt nur Tags `v*` zu und
# verlangt eine Freigabe durch den Besitzer (Einrichtung: CLAUDE.md,
# Abschnitt „Release“). Fehlt der Schlüssel, bricht der Lauf ab: keine
# unsignierte oder mit dem Debug-Schlüssel signierte APK.
#
# Fremde Actions sind auf Commit-SHAs festgelegt (Kommentar = Version), damit
# eine nachträglich geänderte Version nicht an den Schlüssel kommt.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: APK und Firmware veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - name: Nur von einem Tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Releases nur von einem Tag v* (beim Start von Hand einen Tag als Ref wählen)."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Kein Signaturschlüssel (Secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS im Environment „release“). Abbruch, es wird nichts veröffentlicht."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.6'
          channel: stable

      - name: Tests
        run: |
          (cd packages/can_link && flutter pub get && flutter test --reporter failures-only)
          (cd app && flutter pub get && flutter analyze && flutter test --reporter failures-only)

      - name: APK bauen (arm64)
        working-directory: app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-number=${{ github.run_number }}
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          mkdir -p "$RUNNER_TEMP/out"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$RUNNER_TEMP/out/can-werkbank-$version-${{ github.run_number }}-arm64-v8a.apk"

      # Sicherheitsnetz: Gradle fällt ohne Schlüssel auf den Debug-Schlüssel
      # zurück. So eine APK darf nie veröffentlicht werden.
      - name: Signatur prüfen
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          certs=$("$apksigner" verify --print-certs "$RUNNER_TEMP"/out/*.apk)
          echo "$certs" | grep -E 'Signer #1 certificate (DN|SHA-256)'
          if echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::APK ist mit dem Debug-Schlüssel signiert. Abbruch."
            exit 1
          fi

      # Schlüssel nicht länger als nötig auf dem Rechner lassen.
      - name: Schlüssel löschen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Firmware – Kern-Tests
        working-directory: firmware
        run: ./test/run_tests.sh

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Firmware bauen
        working-directory: firmware
        run: |
          pip install --quiet platformio
          pio run -e xiao_esp32c6
          cp .pio/build/xiao_esp32c6/firmware.bin "$RUNNER_TEMP/out/can-logger-xiao-esp32c6.bin"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            CAN-Werkbank (APK für Android, arm64) und Firmware für den CAN-Leser
            (Seeed XIAO ESP32-C6 mit XIAO CAN Bus Expansion Board).
            Flashen: siehe README. Nur mithören; Nutzung auf eigene Gefahr.
          files: ${{ runner.temp }}/out/*
