; CAN-Leser für den Seeed Studio XIAO ESP32-C6 mit dem
; „XIAO CAN Bus Expansion Board“ (MCP2515). Siehe README.md.

[platformio]
default_envs = xiao_esp32c6

[env:xiao_esp32c6]
; Der XIAO ESP32-C6 braucht Arduino-ESP32 3.x. Die offizielle
; PlatformIO-Plattform bringt nur 2.x mit, deshalb die Community-Plattform
; „pioarduino“. Fest auf eine Version: „stable“ wechselte auf Arduino-ESP32 4.x,
; damit baut NimBLE-Arduino 2.x nicht mehr (nur noch Extended Advertising).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
build_flags =
  ; serielle Konsole über den USB-C-Anschluss
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  autowp/autowp-mcp2515@^1.2.1
  h2zero/NimBLE-Arduino@^2.1.0
